# Temporary one-shot workflow: remove this file before merging the remediation PR.
name: One-time Python security lock refresh

on:
  push:
    branches:
      - fix/security-dependencies-2026-11
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: read

concurrency:
  group: python-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: '0.11.7'

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Raise minimum safe version for direct HTTP client dependency
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          project = Path('pyproject.toml')
          value = project.read_text(encoding='utf-8')
          old = '"httpx2>=2.7.0,<3"'
          assert value.count(old) == 1, 'Unexpected httpx2 constraint: inspect manually'
          project.write_text(value.replace(old, '"httpx2>=2.12.0,<3"'), encoding='utf-8')
          PYCODE

      - name: Refresh vulnerable Python packages and sync
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          uv lock \
            --upgrade-package certifi \
            --upgrade-package filelock \
            --upgrade-package httpcore2 \
            --upgrade-package httpx2 \
            --upgrade-package msgpack \
            --upgrade-package pip \
            --upgrade-package urllib3
          uv lock --check
          uv sync --all-groups --locked
          git diff --stat -- pyproject.toml uv.lock

      - name: Audit refreshed environment
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pip_audit --strict --cache-dir .treta/pip-audit-cache

      - name: Upload candidate lockfile for review
        if: ${{ always() && steps.refresh.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: treta-reviewed-candidate-python-deps
          path: |
            pyproject.toml
            uv.lock
          if-no-files-found: error
          retention-days: 7
